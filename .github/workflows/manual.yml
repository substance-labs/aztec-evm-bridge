name: Run Tests

on:
  pull_request:
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Setup Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Run EVM tests
      run: cd packages/evm && forge test

    - name: Run Aztec gateway tests
      run: cd packages/aztec/aztec_gateway_7683 && yarn test

    - name: Run filler tests
      run: cd packages/filler && yarn test

    - name: Run SDK tests
      run: cd packages/sdk && yarn test
